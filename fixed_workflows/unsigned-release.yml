name: Unsigned Release

# Builds installable, developer-account-free artifacts and publishes them to a
# GitHub Release:
#   * Android  -> .apk  (arm64, arm32, universal)
#   * iOS      -> .ipa  (unsigned, for AltStore / Sideloadly / TrollStore)
#
# No secrets are required: GITHUB_TOKEN is provisioned automatically, the
# Android release build falls back to the debug signing config (see
# android/app/build.gradle.kts) and the iOS archive is produced with code
# signing disabled.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build/publish (defaults to pubspec.yaml version)"
        required: false
        type: string
      publish:
        description: "Publish a GitHub Release (off = build artifacts only)"
        required: false
        default: true
        type: boolean

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_NAME: SpotiFLAC
  ANDROID_NDK_VERSION: "29.0.14206865"
  ANDROID_PLATFORM: "platforms;android-35"
  ANDROID_BUILD_TOOLS: "build-tools;35.0.0"
  XCODE_VERSION: "26.1.1"

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the version once so every downstream job names its output the same.
  # ---------------------------------------------------------------------------
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve version and release channel
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="v$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml | tr -d '[:space:]')"
          fi
          case "$VERSION" in v*) ;; *) VERSION="v${VERSION}" ;; esac

          case "$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]')" in
            *-alpha*|*-beta*|*-rc*|*-preview*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            PUBLISH="${INPUT_PUBLISH}"
          else
            PUBLISH=true
          fi

          {
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "publish=${PUBLISH}"
          } | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Android: gomobile AAR -> Flutter release APKs (debug-key signed => sideloadable)
  # ---------------------------------------------------------------------------
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: meta
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;${ANDROID_NDK_VERSION}" "${ANDROID_PLATFORM}" "${ANDROID_BUILD_TOOLS}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Go backend (gomobile AAR)
        working-directory: go_backend
        env:
          CGO_ENABLED: 1
        run: |
          set -euo pipefail
          # Installed from inside the module so the go.mod-pinned x/mobile is used.
          go install golang.org/x/mobile/cmd/gomobile
          gomobile init
          mkdir -p ../android/app/libs
          # arm/arm64 only: the --target-platform flag below restricts the ABIs
          # (the app no longer sets ndk.abiFilters, which would conflict with
          # Flutter's --split-per-abi).
          gomobile bind -target=android/arm,android/arm64 -androidapi 24 \
            -o ../android/app/libs/gobackend.aar .

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build release APKs
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64
          ls -la build/app/outputs/flutter-apk/

      - name: Collect and rename APKs
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          SRC=build/app/outputs/flutter-apk
          mkdir -p dist

          copy_apk() {
            [ -f "$SRC/$1" ] || { echo "::error::missing APK $1"; exit 1; }
            cp "$SRC/$1" "dist/${APP_NAME}-${VERSION}-$2.apk"
          }

          copy_apk app-arm64-v8a-release.apk   arm64
          copy_apk app-armeabi-v7a-release.apk arm32
          # The universal APK is optional: only present when the ABI split emits it.
          if [ -f "$SRC/app-release.apk" ]; then
            cp "$SRC/app-release.apk" "dist/${APP_NAME}-${VERSION}-universal.apk"
          fi

          ls -la dist

      - name: Verify APK integrity
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            echo "::group::$(basename "$apk")"
            "$APKSIGNER" verify --print-certs "$apk"
            echo "::endgroup::"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # iOS: gomobile XCFramework -> unsigned xcarchive -> real .ipa (Payload/*.app)
  # ---------------------------------------------------------------------------
  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-15
    needs: meta
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -e
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          elif [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          else
            sudo xcode-select -s /Applications/Xcode.app || true
          fi
          xcodebuild -version
          ls /Applications/ | grep Xcode

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'pubspec.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Build Go backend (gomobile XCFramework)
        working-directory: go_backend
        env:
          CGO_ENABLED: 1
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile
          gomobile init
          mkdir -p ../ios/Frameworks
          gomobile bind -target=ios -tags ios -o ../ios/Frameworks/Gobackend.xcframework .
          test -d ../ios/Frameworks/Gobackend.xcframework

      - name: Link XCFramework into the Xcode project
        run: |
          set -euo pipefail
          gem list -i xcodeproj >/dev/null 2>&1 || sudo gem install xcodeproj --no-document

          cat > /tmp/add_framework.rb <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target  = project.targets.find { |t| t.name == 'Runner' } or abort('Runner target not found')

          group = project.main_group.find_subpath('Frameworks', true)
          path  = 'Frameworks/Gobackend.xcframework'

          # Idempotent: skip when a previous run already linked the framework.
          if group.files.any? { |f| f.path == path }
            puts 'Gobackend.xcframework already linked'
            exit 0
          end

          ref = group.new_file(path, :project)
          target.frameworks_build_phase.add_file_reference(ref)

          embed = target.build_phases.find do |p|
            p.is_a?(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase) && p.name == 'Embed Frameworks'
          end
          if embed
            embed.add_file_reference(ref).settings = {
              'ATTRIBUTES' => %w[CodeSignOnCopy RemoveHeadersOnCopy]
            }
          end

          project.save
          puts 'Linked Gobackend.xcframework'
          RUBY

          ruby /tmp/add_framework.rb

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Normalize ffmpeg plugin shell scripts (strip CRLF)
        run: |
          find "$HOME/.pub-cache/hosted" -path "*ffmpeg_kit_flutter_new_full*/scripts/*.sh" -type f -print0 |
            while IFS= read -r -d '' f; do
              perl -pi -e 's/\r$//' "$f"
              chmod +x "$f"
            done

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Archive Runner without code signing
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --config-only
          cd ios
          pod install
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Package IPA
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          test -d "$APP" || { echo "::error::Runner.app missing from archive"; exit 1; }

          STAGE="$RUNNER_TEMP/ipa"
          rm -rf "$STAGE" && mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/Runner.app"

          # Sideloading tools re-sign the bundle: drop any stale signature
          # residue so AltStore/Sideloadly start from a clean payload.
          find "$STAGE/Payload" \( -name _CodeSignature -o -name 'embedded.mobileprovision' \) \
            -prune -exec rm -rf {} +

          mkdir -p dist
          IPA="$PWD/dist/${APP_NAME}-${VERSION}-ios-unsigned.ipa"
          ( cd "$STAGE" && zip -qry "$IPA" Payload )

          # An IPA is a zip whose first entry is Payload/<App>.app - assert it.
          unzip -l "$IPA" | head -20
          unzip -l "$IPA" | grep -q 'Payload/Runner.app/Info.plist' \
            || { echo "::error::IPA payload is malformed"; exit 1; }
          du -h "$IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Publish every artifact to a single GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [meta, android, ios]
    if: needs.meta.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum ./*.apk ./*.ipa | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        continue-on-error: true
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: /tmp/changelog.md

      - name: Compose release notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          NOTES=/tmp/release_notes.md
          : > "$NOTES"

          if [ -s /tmp/changelog.md ]; then
            sed '/^## [0-9]/d; /^\*\*Full Changelog\*\*/d' /tmp/changelog.md >> "$NOTES"
          fi

          PREV_TAG=$(git describe --tags --abbrev=0 "$(git rev-list -n 1 "$VERSION" 2>/dev/null || git rev-parse HEAD)^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREV_TAG" "$VERSION" >> "$NOTES"
          fi

          cat >> "$NOTES" <<EOF

          ---

          ### Downloads

          | Platform | File | Notes |
          | --- | --- | --- |
          | Android (arm64) | \`${APP_NAME}-${VERSION}-arm64.apk\` | Recommended for all modern devices |
          | Android (arm32) | \`${APP_NAME}-${VERSION}-arm32.apk\` | Older 32-bit devices |
          | Android (universal) | \`${APP_NAME}-${VERSION}-universal.apk\` | Both ABIs in one, larger download |
          | iOS | \`${APP_NAME}-${VERSION}-ios-unsigned.ipa\` | Unsigned, sideload required |

          ### Installation

          - **Android** — enable *Install unknown apps* for your browser/file manager, then open the APK.
          - **iOS** — sideload the IPA with AltStore, SideStore, Sideloadly or TrollStore. The build is
            intentionally unsigned, so your sideloader signs it with your own Apple ID on-device.

          Verify your download against \`SHA256SUMS.txt\`.
          EOF

          cat "$NOTES"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          name: ${{ env.APP_NAME }} Mobile ${{ needs.meta.outputs.version }}
          body_path: /tmp/release_notes.md
          files: |
            dist/*.apk
            dist/*.ipa
            dist/SHA256SUMS.txt
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          draft: false
          fail_on_unmatched_files: true
