org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableR8.fullMode=false

# AGP 9.x compatibility for the Flutter Gradle plugin.
#
# * android.newDsl=false restores the legacy DSL types (AbstractAppExtension /
#   BaseExtension) that Flutter's Gradle plugin still casts against. AGP 9 made
#   the new DSL the default, which breaks Flutter < 3.47 with
#   "ApplicationExtensionImpl cannot be cast to AbstractAppExtension".
# * android.builtInKotlin=false keeps Kotlin handled by the org.jetbrains.kotlin
#   .android Gradle plugin: Flutter 3.44 supports AGP 9 only with built-in
#   Kotlin disabled (built-in Kotlin needs Flutter 3.47+), and plugins that
#   still apply the kotlin-android plugin fail otherwise.
# Both flags are deprecated and will be removed in AGP 10.0; drop them when the
# Flutter toolchain is bumped past 3.47 and third-party plugins support AGP 9.
android.newDsl=false
android.builtInKotlin=false
