name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      site_exists: ${{ steps.site_check.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check site directory
        id: site_check
        run: |
          if [ -d site ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No site/ directory in this repository; skipping Pages deployment."
          fi

      - name: Setup Pages
        if: steps.site_check.outputs.exists == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.site_check.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.site_exists == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
