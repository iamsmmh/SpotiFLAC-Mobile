name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      dart: ${{ steps.filter.outputs.dart }}
      go: ${{ steps.filter.outputs.go }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dart:
              - 'lib/**'
              - 'test/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'l10n.yaml'
              - '.fvmrc'
              - '.github/workflows/ci.yml'
            go:
              - 'go_backend/**'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - 'go_backend/**'
              - 'lib/models/settings.dart'
              - 'lib/providers/download_queue_provider*.dart'
              - 'lib/services/download_request_payload.dart'
              - 'lib/services/history_database.dart'
              - 'lib/services/platform_bridge.dart'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.fvmrc'
              - '.github/workflows/ci.yml'

  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dart == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          if ! flutter analyze 2>&1 | tee analyze.log; then
            # Surface analyzer findings as annotations so failures are
            # diagnosable from the Checks API (not just the raw log).
            findings=$(grep -E "^[[:space:]]*(error|warning|info) " analyze.log | head -40)
            [ -n "$findings" ] || findings=$(tail -n 20 analyze.log)
            printf '%s\n' "$findings" | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Run tests
        # The github reporter emits each *located* failing test as an ::error
        # annotation, but annotation messages are size-truncated on the Checks
        # API and the raw job log is not retrievable from outside the Actions
        # storage backend. On failure, re-emit each failing test as its own
        # small annotation (name + first ~60 detail lines) so the Checks API
        # names the culprit with enough context to debug without raw-log access.
        run: |
          set -o pipefail
          status=0
          flutter test --reporter github --coverage 2>&1 | tee test.log || status=$?
          if [ "$status" -eq 0 ] && [ -f coverage/lcov.info ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re
          total_hits = total_fns = 0
          for line in open('coverage/lcov.info', encoding='utf-8', errors='replace'):
              m = re.match(r'^(LF|LH):(\d+)$', line.strip())
              if m:
                  if m.group(1) == 'LF':
                      total_fns += int(m.group(2))
                  else:
                      total_hits += int(m.group(2))
          if total_fns:
              pct = 100.0 * total_hits / total_fns
              print(f'**Flutter line coverage:** {total_hits}/{total_fns} lines — {pct:.1f}%')
          PY
          fi
          if [ "$status" -ne 0 ]; then
          python3 - <<'PY'
          import re
          text = open('test.log', encoding='utf-8', errors='replace').read()
          blocks = re.split(r'(?m)^(?=::group::❌)', text)
          failing = [b for b in blocks[1:] if '::group::❌' in b]
          if not failing:
              print('::error::No per-test failure blocks found; last log lines:')
              for line in [l for l in text.splitlines() if l.strip()][-60:]:
                  print('::error::' + line.replace('%', '%25').replace('\n', '%0A'))
          else:
              for i, block in enumerate(failing, 1):
                  head, sep, _rest = block.partition('::endgroup::')
                  if not sep:
                      continue
                  title = head.splitlines()[0].replace('::group::', '').strip()
                  lines = [l.rstrip() for l in head.splitlines()[1:] if l.strip()]
                  if not lines:
                      lines = ['(no detail lines emitted by reporter)']
                  for part, start in enumerate(range(0, min(len(lines), 120), 25), 1):
                      chunk = '\n'.join(lines[start:start + 25])
                      msg = ('failed test %d (part %d): %s\n%s' % (i, part, title, chunk)).replace('%', '%25').replace('\n', '%0A')
                      print('::error::' + msg)
          m = re.search(r'(?m)^.*(?:Some tests failed|tests passed).*$', text)
          if m:
              print('::error::' + m.group(0).replace('%', '%25').replace('\n', '%0A'))
          PY
          fi
          exit "$status"
  go:
    name: Go vet & test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'

    defaults:
      run:
        working-directory: go_backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: |
          set -euo pipefail
          go test -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1 | \
            awk '{printf "**Go line coverage:** %s\n", $NF}' >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests (race)
        # The backend owns long-lived goroutines (extension runtimes, worker
        # panics, cancel registry, progress streams); data races there are
        # invisible to serial runs. A second, race-enabled pass over the full
        # suite keeps the signal without doubling wall time of the first.
        run: go test -race -shuffle=on -count=1 ./...

  android:
    name: Android compile & native tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.android == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.1"

      - name: Install Android SDK & NDK
        run: |
          bash .github/scripts/setup-android-sdk.sh
        env:
          ANDROID_NDK_VERSION: "29.0.14206865"
          ANDROID_PLATFORM: "platforms;android-37"
          ANDROID_BUILD_TOOLS: "build-tools;35.0.0"

      - name: Build Go backend (gomobile AAR)
        working-directory: go_backend
        env:
          CGO_ENABLED: 1
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile
          gomobile init
          mkdir -p ../android/app/libs
          gomobile bind -target=android/arm,android/arm64,android/amd64 -androidapi 24 \
            -o ../android/app/libs/gobackend.aar .
          test -f ../android/app/libs/gobackend.aar

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Compile Android app
        # Raw job logs are not reachable from every environment, so re-emit
        # the Kotlin/Dart/Gradle error lines as annotations on failure.
        run: |
          set -o pipefail
          if ! flutter build apk --debug 2>&1 | tee build.log; then
            findings=$(grep -E "^e: |: error: |^Error: |What went wrong|FAILURE:|Caused by:|Execution failed" build.log | head -40)
            [ -n "$findings" ] || findings=$(tail -n 40 build.log)
            encoded=$(printf '%s' "$findings" | head -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${encoded}"
            exit 1
          fi

      - name: Run native unit tests
        working-directory: android
        # Scope to :app — 'testDebugUnitTest' with no project would also run
        # every Flutter plugin module's own unit tests (e.g.
        # shared_preferences_android), which are not ours to gate on.
        run: |
          set -o pipefail
          if ! ./gradlew :app:testDebugUnitTest 2>&1 | tee gradle-test.log; then
            findings=$(grep -E " FAILED$|FAILED \(|e: |error: |Caused by:|What went wrong" gradle-test.log | head -40)
            [ -n "$findings" ] || findings=$(tail -n 30 gradle-test.log)
            encoded=$(printf '%s' "$findings" | head -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${encoded}"
            exit 1
          fi

