name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      dart: ${{ steps.filter.outputs.dart }}
      go: ${{ steps.filter.outputs.go }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dart:
              - 'lib/**'
              - 'test/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'l10n.yaml'
              - '.fvmrc'
              - '.github/workflows/ci.yml'
            go:
              - 'go_backend/**'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - 'go_backend/**'
              - 'lib/models/settings.dart'
              - 'lib/providers/download_queue_provider*.dart'
              - 'lib/services/download_request_payload.dart'
              - 'lib/services/history_database.dart'
              - 'lib/services/platform_bridge.dart'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.fvmrc'
              - '.github/workflows/ci.yml'

  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dart == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          if ! flutter analyze 2>&1 | tee analyze.log; then
            # Surface analyzer findings as annotations so failures are
            # diagnosable from the Checks API (not just the raw log).
            findings=$(grep -E "^[[:space:]]*(error|warning|info) " analyze.log | head -40)
            [ -n "$findings" ] || findings=$(tail -n 20 analyze.log)
            printf '%s\n' "$findings" | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Run tests
        run: |
          set -o pipefail
          if ! flutter test 2>&1 | tee test.log; then
            findings=$(grep -E "\[E\]" test.log | head -20; grep -A8 -E "\[E\]" test.log | head -100)
            [ -n "$findings" ] || findings=$(tail -n 40 test.log)
            encoded=$(printf '%s' "$findings" | head -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${encoded}"
            exit 1
          fi

  go:
    name: Go vet & test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'

    defaults:
      run:
        working-directory: go_backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  android:
    name: Android compile & native tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.android == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.1"

      - name: Install Android SDK & NDK
        run: |
          bash .github/scripts/setup-android-sdk.sh
        env:
          ANDROID_NDK_VERSION: "29.0.14206865"
          ANDROID_PLATFORM: "platforms;android-37"
          ANDROID_BUILD_TOOLS: "build-tools;35.0.0"

      - name: Build Go backend (gomobile AAR)
        working-directory: go_backend
        env:
          CGO_ENABLED: 1
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile
          gomobile init
          mkdir -p ../android/app/libs
          gomobile bind -target=android/arm,android/arm64,android/amd64 -androidapi 24 \
            -o ../android/app/libs/gobackend.aar .
          test -f ../android/app/libs/gobackend.aar

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Compile Android app
        run: flutter build apk --debug

      - name: Run native unit tests
        working-directory: android
        # Scope to :app — 'testDebugUnitTest' with no project would also run
        # every Flutter plugin module's own unit tests (e.g.
        # shared_preferences_android), which are not ours to gate on.
        run: |
          set -o pipefail
          if ! ./gradlew :app:testDebugUnitTest 2>&1 | tee gradle-test.log; then
            findings=$(grep -E " FAILED$|FAILED \(|e: |error: |Caused by:|What went wrong" gradle-test.log | head -40)
            [ -n "$findings" ] || findings=$(tail -n 30 gradle-test.log)
            encoded=$(printf '%s' "$findings" | head -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${encoded}"
            exit 1
          fi

