# TEMPORARY diagnostic workflow.
#
# The Actions raw-log and artifact endpoints live in blob storage that is not
# reachable from the environment this branch is being developed in, so
# `flutter analyze` failures were undiagnosable. This workflow republishes the
# analyzer output through the REST API (a PR comment), which *is* reachable.
#
# Delete this file before merging — `ci.yml` remains the real gate.
name: Analyze report (temporary)

on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-report:
    name: Publish analyzer output
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze
        id: analyze
        run: |
          set +e
          flutter analyze > analyze.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat analyze.log

      - name: Run tests
        id: tests
        run: |
          set +e
          flutter test --reporter expanded > test.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -c 40000 test.log > test.tail.log

      - name: Publish results as a PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Analyzer report (temporary diagnostic)"
            echo
            echo "commit \`${GITHUB_SHA}\` · analyze exit ${{ steps.analyze.outputs.exit_code }} · test exit ${{ steps.tests.outputs.exit_code }}"
            echo
            echo '### flutter analyze'
            echo '```'
            head -c 40000 analyze.log
            echo '```'
            echo
            echo '### flutter test (tail)'
            echo '```'
            grep -E "^[0-9]+:[0-9]+ \+.*(-|failed)|Error|Exception|^  [a-z_/]+\.dart" test.tail.log | head -120 || true
            tail -c 8000 test.tail.log
            echo '```'
          } > comment.md

          pr=$(gh pr list --head "${GITHUB_REF_NAME}" --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body-file comment.md
          else
            echo "No open PR for ${GITHUB_REF_NAME}; skipping comment."
          fi
