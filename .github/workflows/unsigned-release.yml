name: Unsigned Release

# Builds installable, developer-account-free artifacts and publishes them to a
# GitHub Release:
#   * Android  -> .apk  (arm64, arm32, universal)
#   * iOS      -> .ipa  (unsigned, for AltStore / Sideloadly / TrollStore)
#
# No secrets are required: GITHUB_TOKEN is provisioned automatically, the
# Android release build falls back to the debug signing config (see
# android/app/build.gradle.kts) and the iOS archive is produced with code
# signing disabled.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build/publish (defaults to pubspec.yaml version)"
        required: false
        type: string
      publish:
        description: "Publish a GitHub Release (off = build artifacts only)"
        required: false
        default: true
        type: boolean

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_NAME: SpotiFLAC
  ANDROID_NDK_VERSION: "29.0.14206865"
  ANDROID_PLATFORM: "platforms;android-35"
  ANDROID_BUILD_TOOLS: "build-tools;35.0.0"
  XCODE_VERSION: "26.1.1"

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the version once so every downstream job names its output the same.
  # ---------------------------------------------------------------------------
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve version and release channel
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="v$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml | tr -d '[:space:]')"
          fi
          case "$VERSION" in v*) ;; *) VERSION="v${VERSION}" ;; esac

          case "$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]')" in
            *-alpha*|*-beta*|*-rc*|*-preview*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            PUBLISH="${INPUT_PUBLISH}"
          else
            PUBLISH=true
          fi

          {
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "publish=${PUBLISH}"
          } | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Android: gomobile AAR -> Flutter release APKs (debug-key signed => sideloadable)
  # ---------------------------------------------------------------------------
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: meta
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;${ANDROID_NDK_VERSION}" "${ANDROID_PLATFORM}" "${ANDROID_BUILD_TOOLS}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Go backend (gomobile AAR)
        working-directory: go_backend
        env:
          CGO_ENABLED: 1
        run: |
          set -euo pipefail
          # Installed from inside the module so the go.mod-pinned x/mobile is used.
          go install golang.org/x/mobile/cmd/gomobile
          gomobile init
          mkdir -p ../android/app/libs
          # arm/arm64 only: the --target-platform flag below restricts the ABIs
          # (the app no longer sets ndk.abiFilters, which would conflict with
          # Flutter's --split-per-abi).
          gomobile bind -target=android/arm,android/arm64 -androidapi 24 \
            -o ../android/app/libs/gobackend.aar .

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build release APKs
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64
          ls -la build/app/outputs/flutter-apk/

      - name: Collect and rename APKs
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
         
